{% load static %}
<header class="site-header">
  <div class="container header">
    <div class="header_list">
      <a href="{% url 'questions:index' %}" class="logo">Message.Me</a>
      <div class="search_ask">
        <form action="{% url 'questions:index' %}" method="get" role="search" class="search-form">
          <label class="visually-hidden" for="site-search">Search</label>
          <input type="search" id="site-search" name="q" class="search" placeholder="Search" maxlength="100" value="{{ search_query|default:'' }}">
        </form>
        {% if user.is_authenticated %}<a href="{% url 'questions:ask' %}" class="btn ask">ASK!</a>{% endif %}
      </div>
      <nav class="user" aria-label="Account">
        {% if user.is_authenticated %}
          <img class="avatar header-avatar" src="{{ user.profile.avatar_url }}" alt="" width="36" height="36">
          <div>
            <div class="account-name">{{ user.profile }}</div>
            <div class="account-links">
              <a href="{% url 'core:profile' %}">settings</a>
              <form method="post" action="{% url 'core:logout' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="logout-link" type="submit">log out</button></form>
            </div>
          </div>
        {% else %}
          <a href="{% url 'core:login' %}?next={{ request.get_full_path|urlencode }}">log in</a>
          <a href="{% url 'core:signup' %}">register</a>
        {% endif %}
      </nav>
    </div>
  </div>
</header>
