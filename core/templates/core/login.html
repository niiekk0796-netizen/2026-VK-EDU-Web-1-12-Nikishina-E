{% extends "core/base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<h1>Log In</h1>
<form method="post" class="form-panel">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {% include "core/includes/form_fields.html" %}
  <div class="form-actions"><button class="btn primary-button" type="submit">Log in</button><a href="{% url 'core:signup' %}">create new account</a></div>
</form>
{% endblock %}
