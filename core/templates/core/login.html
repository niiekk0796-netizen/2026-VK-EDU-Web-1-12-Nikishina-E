{% extends "core/base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
  <h1>Log In</h1>
  <form method="post" class="form-panel" data-demo-form>
    {% csrf_token %}
    <p class="form-error" role="alert">Sorry, wrong password!</p>
    <div class="form-row">
      <label for="field-username" class="form-label">Login</label>
      <div><input class="form-control" id="field-username" aria-describedby="field-username-help" name="username" type="text" maxlength="40" autocomplete="username" required placeholder="Enter your login here"><div class="form-help" id="field-username-help">Логин, указанный при регистрации.</div></div>
    </div>
    <div class="form-row">
      <label for="field-password" class="form-label">Password</label>
      <div><input class="form-control" id="field-password" aria-describedby="field-password-help" name="password" type="password" maxlength="128" autocomplete="current-password" required><div class="form-help" id="field-password-help">Не меньше 8 символов.</div></div>
    </div>
    <div class="form-actions">
      <button class="btn primary-button" type="submit">Log in!</button>
      <a href="{% url 'core:signup' %}">create new account</a>
      {% include "core/includes/form_status.html" %}
    </div>
  </form>
{% endblock %}
