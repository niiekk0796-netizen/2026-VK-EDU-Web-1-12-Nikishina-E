{% extends "base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
  <h1>Log In</h1>
  <form method="post" class="form-panel" data-demo-form>
    {% csrf_token %}
    <p class="form-error" role="alert">Sorry, wrong password!</p>
    <div class="form-row">
      <label for="field-username" class="form-label">Login</label>
      <input class="form-control" id="field-username" name="username" type="text" maxlength="40" autocomplete="username" required placeholder="Enter your login here">
    </div>
    <div class="form-row">
      <label for="field-password" class="form-label">Password</label>
      <input class="form-control" id="field-password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
    </div>
    <div class="form-actions">
      <button class="btn primary-button" type="submit">Log in!</button>
      <a href="{% url 'core:signup' %}">create new account</a>
      {% include "includes/form_status.html" %}
    </div>
  </form>
{% endblock %}
