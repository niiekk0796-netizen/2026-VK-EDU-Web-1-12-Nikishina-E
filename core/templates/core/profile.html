{% extends "core/base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1>Settings: {{ user.profile }}</h1>
<img class="avatar avatar-preview" src="{{ user.profile.avatar_url }}" alt="{{ user.profile }}">
<form method="post" enctype="multipart/form-data" class="form-panel">
  {% csrf_token %}
  {% include "core/includes/form_fields.html" %}
  <div class="form-actions"><button class="btn primary-button" type="submit">Save</button></div>
</form>
{% endblock %}
