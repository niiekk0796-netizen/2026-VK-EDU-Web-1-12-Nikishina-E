services:
  db:
    image: postgres:17
    env_file: .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME:-message_me}
      POSTGRES_USER: ${DB_USER:-message_me}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database:/var/lib/postgresql/data
  web:
    build: .
    env_file: .env.docker
    environment:
      DB_HOST: db
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - media:/app/media
volumes:
  database:
  media:
