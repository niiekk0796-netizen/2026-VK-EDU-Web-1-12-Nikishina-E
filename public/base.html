<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page layout · Message.Me</title>
  <link rel="icon" href="static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/css/bootstrap.min.css">
  <link rel="stylesheet" href="static/css/reset.css">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/pages.css">
  <script src="static/js/bootstrap.bundle.min.js" defer></script>
  <script src="static/js/demo.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header">
      <div class="header_list">
        <a href="index.html" class="logo"><img src="static/img/favicon.svg" alt="" width="32" height="32">Message.Me</a>
        <div class="search_ask">
          <form action="index.html" method="get" role="search" class="search-form">
            <label class="visually-hidden" for="site-search">Search questions</label>
            <input type="search" id="site-search" name="q" class="search" placeholder="Search questions…" maxlength="100">
          </form>
          <a href="ask.html" class="btn ask">Ask</a>
        </div>
        <nav class="user" aria-label="Account">
          <a href="login.html" class="btn log_out">Log In</a>
          <a href="signup.html" class="btn sign_up">Sign Up Now</a>
        </nav>
      </div>
    </div>
  </header>
  <div class="container content">
    <main class="main" id="main">
      <div class="page-heading">
        <p class="eyebrow">Message.Me</p>
        <h1>Page layout</h1>
        <p>Shared layout for the questions and account pages.</p>
      </div>
    </main>
    <aside class="sidebar" aria-label="Community">
      <section class="sidebar-section popular_tags">
        <h2>Popular Tags</h2>
        <div class="tags">
          <a class="tag" href="tag.html?tag=django">django</a>
<a class="tag" href="tag.html?tag=python">python</a>
<a class="tag" href="tag.html?tag=html">html</a>
<a class="tag" href="tag.html?tag=css">css</a>
<a class="tag" href="tag.html?tag=bootstrap">bootstrap</a>
<a class="tag" href="tag.html?tag=javascript">javascript</a>
        </div>
      </section>
      <section class="sidebar-section best_members">
        <h2>Best Members</h2>
        <ul class="member-list">
          <li><img class="avatar" src="static/img/profile.svg" alt="" width="52" height="52"> Alex Morgan</li>
<li><img class="avatar" src="static/img/profile.svg" alt="" width="52" height="52"> Nina Chen</li>
<li><img class="avatar" src="static/img/profile.svg" alt="" width="52" height="52"> Sam Rivera</li>
<li><img class="avatar" src="static/img/profile.svg" alt="" width="52" height="52"> Taylor Brooks</li>
        </ul>
      </section>
    </aside>
  </div>
  <footer class="container footer"><small>Message.Me · Community questions and answers</small></footer>
</body>
</html>
