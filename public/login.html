<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In · Message.Me</title>
  <link rel="icon" href="static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/css/bootstrap.min.css">
  <link rel="stylesheet" href="static/css/reset.css">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/pages.css">
  <script src="static/js/bootstrap.bundle.min.js" defer></script>
  <script src="static/js/demo.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header">
      <div class="header_list">
        <a href="index.html" class="logo">Message.Me</a>
        <div class="search_ask">
          <form action="index.html" method="get" role="search" class="search-form">
            <label class="visually-hidden" for="site-search">Search</label>
            <input type="search" id="site-search" name="q" class="search" placeholder="Search" maxlength="100">
          </form>

        </div>
        <nav class="user" aria-label="Account">
            <a href="login.html">log in</a>
            <a href="signup.html">register</a>
        </nav>
      </div>
    </div>
  </header>
  <div class="container content">
    <main class="main" id="main">
      <h1>Log In</h1>
      <form method="post" class="form-panel" data-demo-form>
          <p class="form-error" role="alert">Sorry, wrong password!</p>
          <div class="form-row">
            <label for="field-username" class="form-label">Login</label>
            <input class="form-control" id="field-username" name="username" type="text" maxlength="40" autocomplete="username" required placeholder="Enter your login here">
          </div>
          <div class="form-row">
            <label for="field-password" class="form-label">Password</label>
            <input class="form-control" id="field-password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
          </div>
          <div class="form-actions">
            <button class="btn primary-button" type="submit">Log in!</button>
            <a href="signup.html">create new account</a>
            <p class="form-status" data-form-status role="status" hidden></p>
          </div>
        </form>
    </main>
    <aside class="sidebar" aria-label="Community">
      <section class="popular_tags">
        <h2>Popular Tags</h2>
        <div class="tags"><a class="tag" href="tag.html?tag=django">django</a> <a class="tag" href="tag.html?tag=python">python</a> <a class="tag" href="tag.html?tag=html">html</a> <a class="tag" href="tag.html?tag=css">css</a> <a class="tag" href="tag.html?tag=bootstrap">bootstrap</a> <a class="tag" href="tag.html?tag=javascript">javascript</a> <a class="tag" href="tag.html?tag=git">git</a> <a class="tag" href="tag.html?tag=docker">docker</a></div>
      </section>
      <section class="best_members">
        <h2>Best Members</h2>
        <ul class="member-list">
          <li>Mr. Freeman</li>
          <li>Dr. House</li>
          <li>Bender</li>
          <li>Queen Victoria</li>
          <li>V. Pupkin</li>
        </ul>
      </section>
    </aside>
  </div>
  <footer class="container footer"></footer>
</body>
</html>
