<article class="post-card">
  {% include "questions/includes/post_rail.html" with post=answer only %}
  <div class="post-body">
    <p>{{ answer.text }}</p>
    <div class="post-meta">
      <span class="visually-hidden">{{ answer.author }}</span>
      <time class="visually-hidden" datetime="{{ answer.created|date:'Y-m-d' }}">{{ answer.created|date:"M j, Y" }}</time>
      <label class="accepted"><input type="checkbox" disabled{% if answer.accepted %} checked{% endif %}> Correct!</label>
    </div>
  </div>
</article>
