<article class="post-card" id="answer-{{ answer.pk }}">
  {% include "questions/includes/post_rail.html" with post=answer kind="answer" %}
  <div class="post-body">
    <p>{{ answer.text }}</p>
    <div class="post-meta">
      <span>{{ answer.author.profile }}</span>
      <time datetime="{{ answer.created|date:'c' }}">{{ answer.created|date:"d.m.Y H:i" }}</time>
      <label class="accepted"><input type="checkbox"{% if answer.accepted %} checked{% endif %}{% if user.pk != question.author_id %} disabled title="Отметить ответ может автор вопроса"{% endif %}> Correct!</label>
    </div>
  </div>
</article>
