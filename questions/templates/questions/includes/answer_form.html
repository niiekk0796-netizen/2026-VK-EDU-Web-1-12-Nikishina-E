{% if user.is_authenticated %}
<form method="post" class="form-panel answer-form">
  {% csrf_token %}
  {% include "core/includes/form_fields.html" %}
  <button class="btn primary-button" type="submit">Answer</button>
</form>
{% else %}
<p><a href="{% url 'core:login' %}?next={{ request.get_full_path|urlencode }}">Войдите, чтобы ответить.</a></p>
{% endif %}
