{% load static %}
<div class="post-rail">
  <img class="avatar" src="{% static 'img/profile.svg' %}" alt="" width="52" height="52">
  <div class="votes" role="group" aria-label="Vote">
    <button type="button" class="vote" data-vote="1" aria-pressed="{% if post.vote == 1 %}true{% else %}false{% endif %}" aria-label="Upvote">+</button>
    <output class="vote-count" aria-label="Score">{{ post.score }}</output>
    <button type="button" class="vote" data-vote="-1" aria-pressed="{% if post.vote == -1 %}true{% else %}false{% endif %}" aria-label="Downvote">−</button>
  </div>
</div>
