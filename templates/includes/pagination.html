{% if page.has_other_pages %}
  <nav aria-label="Pages">
    <ul class="pagination">
      {% if page.has_previous %}
        <li class="page-item"><a class="page-link" href="{% querystring page=page.previous_page_number %}{{ anchor|default:'' }}" aria-label="Previous page">‹</a></li>
      {% endif %}
      {% for number in page.paginator.page_range %}
        <li class="page-item{% if page.number == number %} active{% endif %}">
          {% if page.number == number %}
            <span class="page-link" aria-current="page">{{ number }}</span>
          {% else %}
            <a class="page-link" href="{% querystring page=number %}{{ anchor|default:'' }}">{{ number }}</a>
          {% endif %}
        </li>
      {% endfor %}
      {% if page.has_next %}
        <li class="page-item"><a class="page-link" href="{% querystring page=page.next_page_number %}{{ anchor|default:'' }}" aria-label="Next page">›</a></li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
