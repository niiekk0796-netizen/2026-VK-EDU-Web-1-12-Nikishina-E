{% load static %}
<aside class="sidebar" aria-label="Community">
      <section class="sidebar-section popular_tags">
        <h2>Popular Tags</h2>
        {% include "questions/includes/tags.html" with tags=popular_tags only %}
      </section>
      <section class="sidebar-section best_members">
        <h2>Best Members</h2>
        <ul class="member-list">
          {% for member in best_members %}
            <li><img class="avatar" src="{% static 'img/profile.svg' %}" alt="" width="52" height="52"> {{ member }}</li>
          {% endfor %}
        </ul>
      </section>
    </aside>
